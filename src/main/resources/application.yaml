spring:
  application:
    name: ${APP_NAME:spring-configserver}
  profiles:
    default: ${SPRING_PROFILES_ACTIVE:opentelemetry}
  cloud:
    active: default # use profile native if you want to use custom properties at classpath
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:true}
      import-check:
        enabled: ${SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED:false}
      server:
        git:
          # required, repo to fetch all properties
          uri: ${SPRING_CLOUD_CONFIG_SERVER_URI:https://github.com/spring-cloud-samples/config-repo}
          # optional, don't need if repo is public
          username: ${SPRING_CLOUD_CONFIG_SERVER_USERNAME:}
          # optional, don't need if repo is public
          password: ${SPRING_CLOUD_CONFIG_SERVER_PASSWORD:}
          # if true, always fetch branch 'master'
          try-master-branch: ${SPRING_CLOUD_CONFIG_SERVER_TRY_MASTER_BRANCH:false}
          # default branch to use
          default-label: ${SPRING_CLOUD_CONFIG_SERVER_DEFAULT_LABEL:main}
          # list of sub-folders from git project
          search-paths: ${SPRING_CLOUD_CONFIG_SERVER_SEARCH_PATHS:config-server*}
server:
  port: ${PORT:8888}
eureka:
  instance:
    leaseRenewalIntervalInSeconds: ${EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS:30}
    health-check-url-path: /actuator/health
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    registryFetchIntervalSeconds: ${EUREKA_CLIENT_FETCH_REGISTRY_INTERVAL_SECONDS:180}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:true}
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://admin:admin@localhost:8761/eureka/}
management:
  server:
    port: ${MANAGEMENT_PORT:8888}
  info:
    env.enabled: true
    java.enabled: true
    os.enabled: true
    process.enabled: true
    git.enabled: true
    git.mode: full
  endpoints:
    jmx.exposure.include: "*"
    web:
      exposure.include: "*"
      cors:
        allowed-origins: ${MANAGEMENT_CORS_ALLOWED_ORIGINS:*}
        allowed-methods: ${MANAGEMENT_CORS_ALLOWED_METHODS:*}
        max-age: ${MANAGEMENT_CORS_ALLOWED_MAXAGE:3600}
  endpoint:
    health:
      show-details: always
      show-components: always
    env:
      show-values: always
    configprops:
      show-values: always
otel:
  file_format: 1.0
  sdk:
    disabled: true